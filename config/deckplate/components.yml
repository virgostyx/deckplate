          - top_start
          - top_end
          - bottom_start
          - bottom_end
          default: top_left
      color:
        required: false
        default: ":primary"
      size:
        required: false
        variant:
          values:
          - sm
          - md
          - lg
          default: md
      width:
        required: false
        default: nil
      height:
        required: false
        default: nil
