# Generated by bin/build-manifest from the component classes, templates and stylesheets. Do not edit.
---
format: 1
common:
  html_options: 'Extra keyword arguments become attributes of the component''s element:
    class (appended), data and aria (merged; controller, action and describedby are
    concatenated), style (appended), id and any other attribute (the caller wins).
    Form controls send them to the native control, not to the wrapper. Components
    that accept them have html_options: true.'
  colors:
  - primary
  - secondary
  - tertiary
  - accent
  - muted
  - info
  - success
  - warning
  - danger
  - emergency
components:
  Breadcrumb:
    class: Deckplate::BreadcrumbComponent
    description: 'items: [["Home", "/"], ["Ships", "/ships"], ["Aurora"]] or [{label:,
      href:}, ...]. The last item is the current page.'
    sheet: controls
    css_block: dp-breadcrumb
    stylesheet: app/assets/stylesheets/deckplate/components/controls/breadcrumb.css
    html_options: true
    params:
      items:
        required: true
    previews:
    - breadcrumb/default
    - breadcrumb/long
  Button:
    class: Deckplate::ButtonComponent
    description: Button, link-button, or button_to form depending on `href:` and `method:`.
      Loading is visual + ARIA only (aria-busy/aria-disabled); use Turbo's data-turbo-submits-with
      to block double submits.
    sheet: controls
    css_block: dp-button
    stylesheet: app/assets/stylesheets/deckplate/components/controls/button.css
    talks_to:
    - dp-sound
    html_options: true
    params:
      label:
        required: false
        default: nil
      color:
        required: false
        default: ":primary"
      shape:
        required: false
        variant:
          values:
          - pill
          - block
          - start
          - end
          default: pill
      size:
        required: false
        variant:
          values:
          - xs
          - sm
          - md
          - lg
          - xl
          default: md
      type:
        required: false
        default: '"button"'
      href:
        required: false
        default: nil
      method:
        required: false
        default: nil
      icon:
        required: false
        default: nil
      loading:
        required: false
        default: 'false'
      disabled:
        required: false
        default: 'false'
    previews:
    - button/default
    - button/states
    - button/variants
  ButtonGroup:
    class: Deckplate::ButtonGroupComponent
    description: Stacked or inline row of buttons sharing the group role.
    sheet: controls
    css_block: dp-button-group
    stylesheet: app/assets/stylesheets/deckplate/components/controls/button-group.css
    html_options: true
    params:
      orientation:
        required: false
        variant:
          values:
          - horizontal
          - vertical
          default: horizontal
      label:
        required: false
        default: nil
    previews:
    - button_group/default
    - button_group/vertical
  Data::BarGraph:
    class: Deckplate::Data::BarGraphComponent
    description: 'Server-rendered bar graph. The bars are decorative; the same data
      is in a visually hidden table (screen readers). With keys:, each item has one
      value per key ([["Mon", [10, 20]], ...]) shown side by side (grouping: :grouped)
      or as consecutive segments of one bar (grouping: :stacked). Keys are told apart
      by colour, pattern and legend name.'
    sheet: data
    css_block: dp-bar-graph
    stylesheet: app/assets/stylesheets/deckplate/components/data/bar-graph.css
    html_options: true
    params:
      label:
        required: true
      series:
        required: true
      max:
        required: false
        default: nil
      orientation:
        required: false
        variant:
          values:
          - horizontal
          - vertical
          default: horizontal
      grouping:
        required: false
        variant:
          values:
          - grouped
          - stacked
          default: grouped
      keys:
        required: false
        default: nil
      color:
        required: false
        default: ":primary"
    previews:
    - bar_graph/default
    - bar_graph/multiple
    - bar_graph/variants
  Data::Clock:
    class: Deckplate::Data::ClockComponent
    description: 'A ticking clock (dp-clock). The text is rendered on the server (the
      initial value); the controller then updates it every second from the *server''s*
      epoch, so a wrong client clock does not matter, and pauses while the tab is
      hidden. `role="timer"` is not a live region: assistive technology does not announce
      every second. Not render-pure by nature: `time:` defaults to the current time
      (pass one to get stable output).'
    sheet: data
    css_block: dp-clock
    stylesheet: app/assets/stylesheets/deckplate/components/data/clock.css
    controllers:
    - dp-clock
    html_options: true
    params:
      time:
        required: false
        default: nil
      format:
        required: false
        default: ":time"
      zone:
        required: false
        default: nil
      label:
        required: false
        default: nil
    previews:
    - clock/default
    - clock/formats
  Data::DataCascade:
    class: Deckplate::Data::DataCascadeComponent
    description: Decorative columns of numbers (aria-hidden, animated by CSS, still
      under prefers-reduced-motion). The numbers come from a seeded generator, so
      the same inputs always give the same HTML.
    sheet: data
    css_block: dp-data-cascade
    stylesheet: app/assets/stylesheets/deckplate/components/data/data-cascade.css
    html_options: true
    params:
      columns:
        required: false
        default: '8'
      rows:
        required: false
        default: '6'
      digits:
        required: false
        default: '4'
      seed:
        required: false
        default: '1'
      color:
        required: false
        default: ":warning"
    previews:
    - data_cascade/default
  Data::DataList:
    class: Deckplate::Data::DataListComponent
    description: 'Key/value panel as a <dl>. items: [["Class", "Explorer"]] or { "Class"
      => "Explorer" }, and/or `with_item(label:) { rich content }`.'
    sheet: data
    css_block: dp-data-list
    stylesheet: app/assets/stylesheets/deckplate/components/data/data-list.css
    html_options: true
    params:
      items:
        required: false
        default: "[]"
      color:
        required: false
        default: ":secondary"
    slots:
      items:
        many: true
        params:
          label:
            required: true
    previews:
    - data_list/default
    - data_list/rich
  Data::Donut:
    class: Deckplate::Data::DonutComponent
    description: 'Share of a whole as a ring, computed on the server as inline SVG
      (no JavaScript, no style attribute). The drawing is decorative: every slice
      is also named, with its value and share, in the legend and in a visually hidden
      table.'
    sheet: data
    css_block: dp-donut
    stylesheet: app/assets/stylesheets/deckplate/components/data/donut.css
    html_options: true
    params:
      label:
        required: true
      series:
        required: true
      center:
        required: false
        default: nil
    previews:
    - donut/default
    - donut/variants
  Data::Gauge:
    class: Deckplate::Data::GaugeComponent
    description: 'Radial or semicircular gauge (role="meter"), pure CSS. value: 0..100.
      Give it an `id:` so a Turbo Stream can replace it.'
    sheet: data
    css_block: dp-gauge
    stylesheet: app/assets/stylesheets/deckplate/components/data/gauge.css
    html_options: true
    params:
      label:
        required: true
      value:
        required: true
      variant:
        required: false
        variant:
          values:
          - radial
          - semicircle
          default: radial
      unit:
        required: false
        default: '"%"'
      color:
        required: false
        default: ":info"
    previews:
    - gauge/default
    - gauge/variants
  Data::LineChart:
    class: Deckplate::Data::LineChartComponent
    description: Line chart with axes, computed on the server as inline SVG (no JavaScript,
      no style attribute). The drawing is decorative; the same data is in a visually
      hidden table. Lines differ by colour, dash pattern and legend name.
    sheet: data
    css_block: dp-line-chart
    stylesheet: app/assets/stylesheets/deckplate/components/data/line-chart.css
    html_options: true
    params:
      label:
        required: true
      x_labels:
        required: true
      series:
        required: true
      area:
        required: false
        default: 'false'
      threshold:
        required: false
        default: nil
    previews:
    - line_chart/default
    - line_chart/variants
  Data::Progress:
    class: Deckplate::Data::ProgressComponent
    description: 'Progress bar (role="progressbar"). value: 0..100, or nil for an
      indeterminate bar. segments: N draws a segmented bar.'
    sheet: data
    css_block: dp-progress
    stylesheet: app/assets/stylesheets/deckplate/components/data/progress.css
    html_options: true
    params:
      label:
        required: true
      value:
        required: true
      segments:
        required: false
        default: nil
      show_value:
        required: false
        default: 'false'
      color:
        required: false
        default: ":primary"
    previews:
    - progress/default
    - progress/variants
  Data::Readout:
    class: Deckplate::Data::ReadoutComponent
    description: 'A labelled value in monospaced tabular figures. The caller formats
      the value; a trend is an icon plus a text. Give it an `id:` so that a Turbo
      Stream can replace it; `flicker: true` blinks an outline when a stream replaces
      it (dp-flicker).'
    sheet: data
    css_block: dp-readout
    stylesheet: app/assets/stylesheets/deckplate/components/data/readout.css
    controllers:
    - dp-flicker
    html_options: true
    params:
      label:
        required: true
      value:
        required: true
      unit:
        required: false
        default: nil
      trend:
        required: false
        default: nil
      color:
        required: false
        default: ":info"
      flicker:
        required: false
        default: 'false'
    previews:
    - readout/default
    - readout/states
  Data::SortableList:
    class: Deckplate::Data::SortableListComponent
    description: 'A list the user can put in order: a pointer drag on the grip, or
      the move up / move down buttons that exist for every item (keyboard, touch,
      screen readers: no drag is ever required, WCAG 2.5.7). The order is kept in
      the DOM, announced politely, sent to the page as a `dp-sortable:reorder` event
      ({ ids }) and, with name:, submitted with a form as one hidden field per item
      (dp-sortable).'
    sheet: data
    css_block: dp-sortable
    stylesheet: app/assets/stylesheets/deckplate/components/data/sortable.css
    controllers:
    - dp-sortable
    html_options: true
    params:
      label:
        required: true
      items:
        required: true
      name:
        required: false
        default: nil
    previews:
    - sortable_list/default
  Data::Sparkline:
    class: Deckplate::Data::SparklineComponent
    description: Tiny trend line as an inline SVG polyline, computed on the server
      (no style attribute, no JavaScript).
    sheet: data
    css_block: dp-sparkline
    stylesheet: app/assets/stylesheets/deckplate/components/data/sparkline.css
    html_options: true
    params:
      label:
        required: true
      points:
        required: true
      color:
        required: false
        default: ":info"
    previews:
    - sparkline/default
    - sparkline/variants
  Data::StatusPill:
    class: Deckplate::Data::StatusPillComponent
    description: 'A status in a pill: text is always there, with a different icon
      per status and a colour role (never colour alone).'
    sheet: data
    css_block: dp-status-pill
    stylesheet: app/assets/stylesheets/deckplate/components/data/status-pill.css
    html_options: true
    params:
      status:
        required: true
        variant:
          values:
          - ok
          - warn
          - fail
          - idle
          - info
          default: ok
      label:
        required: false
        default: nil
    previews:
    - status_pill/all
    - status_pill/default
  Data::Table:
    class: Deckplate::Data::TableComponent
    description: 'Accessible data table. Columns: `t.with_column(:key, header: "Name",
      sortable: true, align: :end, numeric: true) { |row| ... }`.  Sorting contract:
      the HOST sorts. Pass the current `sort:` / `dir:` (usually from params) and
      a `sort_url:` lambda (key, dir) -> url. The component renders sortable headers
      as links and marks the sorted one with aria-sort. A `sort` or `dir` that does
      not match a sortable column is ignored (it is user input). There is no client-side
      sorting.'
    sheet: data
    css_block: dp-table
    stylesheet: app/assets/stylesheets/deckplate/components/data/table.css
    html_options: true
    params:
      rows:
        required: true
      caption:
        required: true
      sort:
        required: false
        default: nil
      dir:
        required: false
        default: nil
      sort_url:
        required: false
        default: nil
      sticky:
        required: false
        default: 'false'
      zebra:
        required: false
        default: 'false'
      caption_hidden:
        required: false
        default: 'false'
      row_id:
        required: false
        default: nil
    slots:
      footer:
        many: false
      empty:
        many: false
    previews:
    - table/default
    - table/empty
    - table/footer
    - table/scrolling
    - table/sorted
  Data::Timeline:
    class: Deckplate::Data::TimelineComponent
    description: 'Vertical timeline of events as an ordered list: `with_event(title:,
      time: nil, datetime: nil, state: :done, color: nil) { body }`. Each event is
      done (a check in its marker), current (aria-current="step") or upcoming (hollow
      marker); the state is never colour alone: a shape or icon, and a visually hidden
      text for assistive technology. `time:` is a text or a Time (shown as "YYYY-MM-DD
      HH:MM", with its ISO 8601 value in `datetime`). The timeline has a colour role;
      one event may take another.'
    sheet: data
    css_block: dp-timeline
    stylesheet: app/assets/stylesheets/deckplate/components/data/timeline.css
    html_options: true
    params:
      color:
        required: false
        default: ":primary"
    slots:
      events:
        many: true
        params:
          title:
            required: true
          time:
            required: false
            default: nil
          datetime:
            required: false
            default: nil
          state:
            required: false
            default: ":done"
          color:
            required: false
            default: nil
    previews:
    - timeline/composition
    - timeline/default
    - timeline/edge_cases
  Disclosure:
    class: Deckplate::DisclosureComponent
    description: 'Native <details>/<summary>: no JavaScript.'
    sheet: controls
    css_block: dp-disclosure
    stylesheet: app/assets/stylesheets/deckplate/components/controls/disclosure.css
    html_options: true
    params:
      summary:
        required: true
      open:
        required: false
        default: 'false'
      color:
        required: false
        default: ":secondary"
    previews:
    - disclosure/default
    - disclosure/variants
  Feedback::Alert:
    class: Deckplate::Feedback::AlertComponent
    description: Inline message. info/success are role="status" (polite), warning/danger
      role="alert" (assertive). The kind is an icon and a word (for assistive technology)
      as well as a colour. `dismissible:` adds a close button (dp-dismiss).
    sheet: feedback
    css_block: dp-alert
    stylesheet: app/assets/stylesheets/deckplate/components/feedback/alert.css
    controllers:
    - dp-dismiss
    html_options: true
    params:
      kind:
        required: false
        variant:
          values:
          - info
          - success
          - warning
          - danger
          default: info
      title:
        required: false
        default: nil
      dismissible:
        required: false
        default: 'false'
    previews:
    - alert/default
    - alert/kinds
  Feedback::Callout:
    class: Deckplate::Feedback::CalloutComponent
    description: A highlighted note inside running content.
    sheet: feedback
    css_block: dp-callout
    stylesheet: app/assets/stylesheets/deckplate/components/feedback/callout.css
    html_options: true
    params:
      kind:
        required: false
        variant:
          values:
          - note
          - tip
          - warning
          default: note
      title:
        required: false
        default: nil
    previews:
    - callout/default
    - callout/kinds
  Feedback::ConditionBanner:
    class: Deckplate::Feedback::ConditionBannerComponent
    description: Ship-wide condition. Text and icon always; critical is an alert,
      pulses (not under prefers-reduced-motion), carries a static hazard marker (the
      non-motion cue) and switches its subtree to the crimson theme when the host
      enabled it.
    sheet: feedback
    css_block: dp-condition-banner
    stylesheet: app/assets/stylesheets/deckplate/components/feedback/condition-banner.css
    html_options: true
    params:
      condition:
        required: false
        variant:
          values:
          - normal
          - caution
          - critical
          default: normal
      label:
        required: false
        default: nil
    previews:
    - condition_banner/conditions
    - condition_banner/default
  Feedback::EmptyState:
    class: Deckplate::Feedback::EmptyStateComponent
    description: '"Nothing here yet": a title, a hint and an action.'
    sheet: feedback
    css_block: dp-empty-state
    stylesheet: app/assets/stylesheets/deckplate/components/feedback/empty-state.css
    html_options: true
    params:
      title:
        required: true
      hint:
        required: false
        default: nil
      icon:
        required: false
        default: nil
      level:
        required: false
        default: '2'
    slots:
      action:
        many: false
    previews:
    - empty_state/default
    - empty_state/variants
  Feedback::Skeleton:
    class: Deckplate::Feedback::SkeletonComponent
    description: Placeholder shapes while content loads. One status text for assistive
      technology; the shapes are hidden from it.
    sheet: feedback
    css_block: dp-skeleton
    stylesheet: app/assets/stylesheets/deckplate/components/feedback/skeleton.css
    html_options: true
    params:
      lines:
        required: false
        default: '1'
      shape:
        required: false
        variant:
          values:
          - text
          - block
          - circle
          default: text
      label:
        required: false
        default: nil
    previews:
    - skeleton/default
    - skeleton/shapes
  Feedback::Spinner:
    class: Deckplate::Feedback::SpinnerComponent
    description: Segmented-bars loader. A status region with a text alternative; the
      bars are decorative.
    sheet: feedback
    css_block: dp-spinner
    stylesheet: app/assets/stylesheets/deckplate/components/feedback/spinner.css
    html_options: true
    params:
      size:
        required: false
        variant:
          values:
          - sm
          - md
          - lg
          default: md
      color:
        required: false
        default: ":primary"
      label:
        required: false
        default: nil
      show_label:
        required: false
        default: 'false'
    previews:
    - spinner/default
    - spinner/variants
  Feedback::Toast:
    class: Deckplate::Feedback::ToastComponent
    description: 'Transient message, appended into the #dp-toasts container (dp_toast_container)
      by a Turbo Stream or rendered from the flash. info/success dismiss themselves
      after `duration` ms (default 5000); warning/danger stay until dismissed (0):
      they must be readable. The timer pauses on hover and focus (dp-toast).'
    sheet: feedback
    css_block: dp-toast
    stylesheet: app/assets/stylesheets/deckplate/components/feedback/toast.css
    controllers:
    - dp-toast
    html_options: true
    params:
      kind:
        required: false
        variant:
          values:
          - info
          - success
          - warning
          - danger
          default: info
      duration:
        required: false
        default: nil
    previews:
    - toast/default
    - toast/kinds
  Forms::Checkbox:
    class: Deckplate::Forms::CheckboxComponent
    description: One checkbox whose label sits next to the box. `unchecked_value:`
      adds a hidden field like Rails' check_box.
    extends: Forms::Control
    sheet: forms
    html_options: true
    params:
      checked:
        required: false
        default: 'false'
      value:
        required: false
        default: '"1"'
      unchecked_value:
        required: false
        default: nil
    previews:
    - checkbox/default
    - checkbox/states
  Forms::Control:
    class: Deckplate::Forms::ControlComponent
    description: 'Base of the form controls: name, derived id, label, hint, errors,
      required/disabled, and the ARIA wiring. Subclasses provide a template that calls
      `render_field { ... }` around the native control. `**html_options` go to the
      native control (class, data, aria, placeholder, min/max, ...), not to the wrapper.'
    abstract: true
    sheet: forms
    html_options: true
    params:
      name:
        required: true
      label:
        required: true
      hint:
        required: false
        default: nil
      errors:
        required: false
        default: nil
      required:
        required: false
        default: 'false'
      disabled:
        required: false
        default: 'false'
      alert:
        required: false
        default: 'false'
  Forms::DateInput:
    class: Deckplate::Forms::DateInputComponent
    description: Native date/time controls. Date, Time and String values are formatted
      the way the control expects.
    extends: Forms::Control
    sheet: forms
    html_options: true
    params:
      type:
        required: false
        default: ":date"
      value:
        required: false
        default: nil
    previews:
    - date_input/default
    - date_input/states
  Forms::FileInput:
    class: Deckplate::Forms::FileInputComponent
    description: 'Native file input inside a FormField. `accept:` is the usual accept
      string, `multiple: true` allows several files.'
    extends: Forms::Control
    sheet: forms
    html_options: true
    params:
      accept:
        required: false
        default: nil
      multiple:
        required: false
        default: 'false'
    previews:
    - file_input/default
    - file_input/states
  Forms::FormActions:
    class: Deckplate::Forms::FormActionsComponent
    description: Row for the submit / cancel controls of a form.
    sheet: forms
    css_block: dp-form-actions
    stylesheet: app/assets/stylesheets/deckplate/components/forms/form-actions.css
    html_options: true
    params:
      align:
        required: false
        variant:
          values:
          - start
          - end
          default: start
    previews:
    - form_actions/aligned
    - form_actions/default
  Forms::FormField:
    class: Deckplate::Forms::FormFieldComponent
    description: 'Label + hint + control + errors with the right for/id/aria-describedby
      wiring. Controls render their own FormField. `as: :fieldset` renders fieldset/legend
      for groups (radios). `label: nil` when the control draws its own label.'
    sheet: forms
    css_block: dp-field
    stylesheet: app/assets/stylesheets/deckplate/components/forms/field.css
    controllers:
    - dp-field
    html_options: true
    params:
      control_id:
        required: true
      label:
        required: true
      hint:
        required: false
        default: nil
      errors:
        required: false
        default: nil
      required:
        required: false
        default: 'false'
      alert:
        required: false
        default: 'false'
      as:
        required: false
        default: ":div"
  Forms::Keypad:
    class: Deckplate::Forms::KeypadComponent
    description: 'A code or number field with an on-screen keypad (1-9, clear, 0,
      delete). The field is a real <input inputmode="numeric">: the physical keyboard
      works, the value is submitted with the form, and the pad only fills it in (dp-keypad).
      A polite live region announces how many digits there are, never which (so a
      masked code is not leaked). `length:` fixes the digit count, `masked: true`
      hides the digits (type=password: the value is never written back into the page),
      `submit:` adds a submit button with that label.'
    extends: Forms::Control
    sheet: forms
    css_block: dp-keypad
    stylesheet: app/assets/stylesheets/deckplate/components/forms/keypad.css
    controllers:
    - dp-keypad
    html_options: true
    params:
      length:
        required: false
        default: nil
      masked:
        required: false
        default: 'false'
      value:
        required: false
        default: nil
      submit:
        required: false
        default: nil
      color:
        required: false
        default: ":primary"
    previews:
    - keypad/default
    - keypad/states
  Forms::RadioGroup:
    class: Deckplate::Forms::RadioGroupComponent
    description: 'Radios in a fieldset: the label is the legend. options: ["A", ["Label",
      "value"]]. layout: :stack | :inline.'
    extends: Forms::Control
    sheet: forms
    css_block: dp-radio-group
    stylesheet: app/assets/stylesheets/deckplate/components/forms/choice.css
    html_options: true
    params:
      options:
        required: true
      value:
        required: false
        default: nil
      layout:
        required: false
        variant:
          values:
          - stack
          - inline
          default: stack
    previews:
    - radio_group/default
    - radio_group/states
  Forms::Range:
