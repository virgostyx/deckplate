  Layout::Frame:
    class: Deckplate::Layout::FrameComponent
    description: 'Page frame: corner elbows, header bar, sidebar, main, aside, footer
      bar. Responsive through container queries (the frame is a page-level layout:
      it fills the width of its parent). Below 48rem the sidebar becomes a native
      popover opened by a "Menu" button (no JavaScript) and the corners are dropped.
      Variants: :classic (sidebar left), :double (sidebar + aside), :minimal (header,
      main, footer only). `animate: true` plays a short entrance cascade (header bar
      reveal, sidebar slide, content fade); off under prefers-reduced-motion.'
    sheet: core
    css_block: dp-frame
    stylesheet: app/assets/stylesheets/deckplate/layout/frame.css
    html_options: true
    params:
      variant:
        required: false
        variant:
          values:
          - classic
          - double
          - minimal
          default: classic
      theme:
        required: false
        default: nil
      fixed:
        required: false
        default: 'false'
      animate:
        required: false
        default: 'false'
    slots:
      header:
        many: false
      sidebar:
        many: false
      aside:
        many: false
      footer:
        many: false
      top_start_corner:
        many: false
      bottom_start_corner:
        many: false
      main:
        many: false
    previews:
    - frame/animated
    - frame/classic
    - frame/double
    - frame/fixed
    - frame/minimal
  Layout::PageHeader:
